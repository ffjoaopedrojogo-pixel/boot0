services:
  - type: worker
    name: sala-futuro-stressor
    runtime: python
    plan: free # Altere para 'starter' se precisar de mais CPU
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python main.py"
    envVars:
      - key: WORKERS_PER_TARGET
        value: "25"
      - key: PYTHON_VERSION
        value: "3.11"
